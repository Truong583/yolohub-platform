
# ============================================================
# YOLOHUB - CI PIPELINE
# Test -> Build -> Security Scan -> Push to GHCR
# ============================================================

name: CI Pipeline

# ------------------------------------------------------------
# 1. WORKFLOW TRIGGERS
# ------------------------------------------------------------

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# ------------------------------------------------------------
# 2. GITHUB PERMISSIONS
# ------------------------------------------------------------

permissions:
  contents: read
  packages: write
  security-events: write

# ------------------------------------------------------------
# 3. GLOBAL ENVIRONMENT
# ------------------------------------------------------------

env:
  IMAGE_BACKEND: ghcr.io/truong583/yolohub-backend
  IMAGE_FRONTEND: ghcr.io/truong583/yolohub-frontend

  NEXT_PUBLIC_API_URL: https://api.truongtest.id.vn/api/v1
  NEXT_PUBLIC_SITE_URL: https://truongtest.id.vn

jobs:

  # ==========================================================
  # JOB 1: TEST AND VALIDATE
  # ==========================================================

  test-and-validate:
    name: TypeCheck & Build Test
    runs-on: ubuntu-latest

    steps:

      # Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      # ------------------------------------------------------
      # BACKEND
      # ------------------------------------------------------

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      - name: TypeScript check backend
        working-directory: ./backend
        run: npx tsc --noEmit

      - name: Build backend
        working-directory: ./backend
        run: npm run build

      # ------------------------------------------------------
      # FRONTEND
      # ------------------------------------------------------

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: ${{ env.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ env.NEXT_PUBLIC_SITE_URL }}

  # ==========================================================
  # JOB 2: BUILD, SCAN AND PUBLISH DOCKER IMAGES
  # Chỉ chạy khi Job 1 thành công và push vào main
  # ==========================================================

  build-and-publish:
    name: Build, Scan & Push Docker Images

    needs:
      - test-and-validate

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:

      # Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------------------
      # LOGIN TO GHCR
      # ------------------------------------------------------

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ======================================================
      # BACKEND: GENERATE TAGS
      # ======================================================

      - name: Generate tags for backend image
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BACKEND }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest

      # ======================================================
      # BACKEND: BUILD IMAGE
      # ======================================================

      - name: Build backend image (not push yet)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile

          push: false
          load: true

          tags: ${{ steps.meta-backend.outputs.tags }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Verify backend image exists locally
      - name: Verify backend image tag
        run: |
          docker image inspect "${IMAGE_BACKEND}:sha-${GITHUB_SHA}" > /dev/null
          echo "Backend image is ready for security scanning."

      # ======================================================
      # BACKEND: TRIVY SECURITY SCAN
      # ======================================================

      - name: Scan backend image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_BACKEND }}:sha-${{ github.sha }}
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH

      # ======================================================
      # BACKEND: PUSH TO GHCR
      # ======================================================

      - name: Push backend image to registry
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile

          push: true

          tags: ${{ steps.meta-backend.outputs.tags }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ======================================================
      # FRONTEND: GENERATE TAGS
      # ======================================================

      - name: Generate tags for frontend image
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_FRONTEND }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest

      # ======================================================
      # FRONTEND: BUILD AND PUSH
      # Truyền API URL production vào Docker Build
      # ======================================================

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile

          push: true

          tags: ${{ steps.meta-frontend.outputs.tags }}

          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
