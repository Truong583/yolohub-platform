
# ============================================================
# CI PIPELINE - YOLOHUB
# ============================================================

name: CI Pipeline

# Chạy khi push hoặc Pull Request vào main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Quyền tối thiểu cần thiết
permissions:
  contents: read
  packages: write
  security-events: write

# Docker image names (lowercase)
env:
  IMAGE_BACKEND: ghcr.io/truong583/yolohub-backend
  IMAGE_FRONTEND: ghcr.io/truong583/yolohub-frontend

jobs:

  # ==========================================================
  # JOB 1: TEST AND VALIDATE
  # ==========================================================
  test-and-validate:
    name: Lint, TypeCheck & Build Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      # Backend
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      - name: TypeScript check backend
        working-directory: ./backend
        run: npx tsc --noEmit

      - name: Build backend
        working-directory: ./backend
        run: npm run build

      # Frontend
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1

  # ==========================================================
  # JOB 2: BUILD, SCAN AND PUBLISH DOCKER IMAGES
  # Chỉ chạy khi push thành công lên main
  # ==========================================================
  build-and-publish:
    name: Build, Scan & Push Docker Images
    needs: [test-and-validate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login GHCR
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------
      # BACKEND: GENERATE TAGS
      # ------------------------------------------------------
      - name: Generate tags for backend image
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BACKEND }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      # Build backend image, load locally for Trivy
      - name: Build backend image (not push yet)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scan backend image
      - name: Scan backend image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_BACKEND }}:sha-${{ github.sha }}
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH

      # Push backend after scan
      - name: Push backend image to registry
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------------------------------
      # FRONTEND: GENERATE TAGS
      # ------------------------------------------------------
      - name: Generate tags for frontend image
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_FRONTEND }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      # Build and push frontend
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
