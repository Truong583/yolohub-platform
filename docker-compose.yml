services:
  backend:
    build: ./backend
    container_name: yolohub-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - db
    networks:
      - yolohub-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build: ./frontend
    container_name: yolohub-ui
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    networks:
      - yolohub-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: mongo:7
    container_name: yolohub-db
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - yolohub-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  reverse-proxy:
    image: nginx:alpine
    container_name: yolohub-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - yolohub-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  seed:
    build:
      context: ./backend
      target: builder
    container_name: yolohub-seed
    command: npm run seed:all
    env_file:
      - ./backend/.env
    depends_on:
      - db
    networks:
      - yolohub-network
    profiles:
      - tools

networks:
  yolohub-network:
    driver: bridge

volumes:
  mongodb_data:
