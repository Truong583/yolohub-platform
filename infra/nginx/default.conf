upstream frontend_upstream {
    server frontend:4000;
}

upstream backend_upstream {
    server backend:8888;
}

server {
    listen 80;
    server_name localhost;

    # Tối ưu kích thước body upload (cho upload khóa học, video, avatar)
    client_max_body_size 50M;

    # Định tuyến API: Tất cả request bắt đầu bằng /api sẽ chuyển vào Backend
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout cấu hình cho API
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Định tuyến Frontend: Tất cả request còn lại chuyển vào Next.js UI
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Báo lỗi tùy chỉnh nếu Backend/Frontend tạm thời chưa bật
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

