# ==============================================================================
# Nginx Reverse Proxy Configuration - YoloHub Production (Mục 5.2, 7 & 8)
# Quản lý định tuyến 3 Subdomain & Bảo mật SSL Cloudflare Origin CA
# ==============================================================================

# Định nghĩa các dịch vụ backend/frontend nội bộ qua Docker Network
upstream frontend_upstream {
    server frontend:4000;
}

upstream backend_upstream {
    server backend:8888;
}

# ------------------------------------------------------------------------------
# 1. BẢO MẬT: Chặn truy cập thẳng bằng IP máy chủ hoặc tên miền lạ (Mục 7 & 8)
# ------------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    # Dùng chứng chỉ để hoàn tất bắt tay SSL trước khi ngắt kết nối
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # Đóng kết nối ngay lập tức (HTTP 444 - No Response), không phản hồi kẻ dò quét
    return 444;
}

# ------------------------------------------------------------------------------
# 2. CHUYỂN HƯỚNG TOÀN BỘ HTTP (CỔNG 80) SANG HTTPS (CỔNG 443)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name yolo.truongtest.id.vn api.truongtest.id.vn admin.truongtest.id.vn truongtest.id.vn www.truongtest.id.vn;
    return 301 https://$host$request_uri;
}

# ------------------------------------------------------------------------------
# 3. SUBDOMAIN 1: FRONTEND HỌC VIÊN (yolo.truongtest.id.vn & truongtest.id.vn)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name yolo.truongtest.id.vn truongtest.id.vn www.truongtest.id.vn;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;

    # Dự phòng: Nếu frontend gọi API dạng tương đối (/api/...) thì vẫn chuyển tiếp vào backend
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tất cả các trang giao diện chuyển vào Next.js UI
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# ------------------------------------------------------------------------------
# 4. SUBDOMAIN 2: TRANG QUẢN TRỊ ADMIN (admin.truongtest.id.vn)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name admin.truongtest.id.vn;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;

    # Nếu truy cập trang chủ admin -> Chuyển hướng vào thẳng trang quản trị /admin
    location = / {
        return 302 https://$host/admin;
    }

    # Định tuyến giao diện quản trị
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------------------------
# 5. SUBDOMAIN 3: CỔNG API BACKEND (api.truongtest.id.vn)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name api.truongtest.id.vn;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;

    # Toàn bộ request vào subdomain api đều được chuyển thẳng vào Express Backend
    location / {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cấu hình timeout cho API
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
