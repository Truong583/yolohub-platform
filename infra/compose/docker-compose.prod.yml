# ==============================================================================
# YoloHub Production Docker Compose (Mục 5 & Mục 6.3)
# Khác với dev: Kéo image trực tiếp từ GHCR (đã qua kiểm thử & scan bảo mật)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Backend API Service
  # ----------------------------------------------------------------------------
  backend:
    image: ghcr.io/truong583/yolohub-backend:${TAG:-latest}
    container_name: yolohub-api
    restart: unless-stopped
    env_file:
      - ../../backend/.env
    depends_on:
      - db
    networks:
      - yolohub-network
    # Tuyệt đối không mở port ra ngoài host, chỉ giao tiếp nội bộ qua reverse-proxy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 2. Frontend UI Service (Next.js Standalone)
  # ----------------------------------------------------------------------------
  frontend:
    image: ghcr.io/truong583/yolohub-frontend:${TAG:-latest}
    container_name: yolohub-ui
    restart: unless-stopped
    env_file:
      - ../../frontend/.env
    depends_on:
      - backend
    networks:
      - yolohub-network
    # Tuyệt đối không mở port ra ngoài host, chỉ giao tiếp nội bộ qua reverse-proxy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 3. Database Service (MongoDB 7)
  # ----------------------------------------------------------------------------
  db:
    image: mongo:7
    container_name: yolohub-db
    restart: unless-stopped
    # Dữ liệu lưu bền vững qua Named Volume (không bị mất khi restart/recreate)
    volumes:
      - mongodb_data:/data/db
    networks:
      - yolohub-network
    # Tuyệt đối không expose port 27017 ra ngoài Internet (Mục 5.1 & 8)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 4. Reverse Proxy & SSL Gateway (Nginx)
  # ----------------------------------------------------------------------------
  reverse-proxy:
    image: nginx:alpine
    container_name: yolohub-nginx
    restart: unless-stopped
    # Chỉ mở cổng 80 (HTTP) và 443 (HTTPS) đón traffic từ Cloudflare
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - yolohub-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ------------------------------------------------------------------------------
# Networks & Volumes
# ------------------------------------------------------------------------------
networks:
  yolohub-network:
    driver: bridge

volumes:
  mongodb_data:

