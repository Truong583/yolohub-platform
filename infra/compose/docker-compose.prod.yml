
# ============================================================
# YOLOHUB - PRODUCTION DOCKER COMPOSE
# Cloudflare -> Ubuntu Nginx -> Docker Containers
# ============================================================

services:

  # ----------------------------------------------------------
  # 1. MONGODB DATABASE
  # ----------------------------------------------------------
  db:
    image: mongo:7
    container_name: yolohub-db
    restart: unless-stopped

    volumes:
      - mongodb_data:/data/db

    networks:
      - yolohub-network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------
  # 2. BACKEND API
  # ----------------------------------------------------------
  backend:
    image: ghcr.io/truong583/yolohub-backend:${TAG:-latest}
    container_name: yolohub-api
    restart: unless-stopped

    env_file:
      - ../../backend/.env

    ports:
      - "127.0.0.1:8888:8888"

    depends_on:
      - db

    networks:
      - yolohub-network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------
  # 3. FRONTEND - NEXT.JS
  # ----------------------------------------------------------
  frontend:
    image: ghcr.io/truong583/yolohub-frontend:${TAG:-latest}
    container_name: yolohub-ui
    restart: unless-stopped

    env_file:
      - ../../frontend/.env

    ports:
      - "127.0.0.1:4000:4000"

    depends_on:
      - backend

    networks:
      - yolohub-network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# ------------------------------------------------------------
# DOCKER NETWORK
# ------------------------------------------------------------

networks:
  yolohub-network:
    driver: bridge

# ------------------------------------------------------------
# PERSISTENT DATABASE STORAGE
# ------------------------------------------------------------

volumes:
  mongodb_data:
